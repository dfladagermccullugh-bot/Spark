[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-agent"
version = "0.1.0"
description = "AI motivation agent for solo creators - your async co-founder"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "gitpython>=3.1",
    "watchdog>=4.0",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    "chromadb>=0.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
spark = "spark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["spark"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
